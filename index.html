<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido a mi página</title>
    
    <!-- Importación oficial de model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #E8DFF5; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }

        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 15px;
            padding: 0 15px;
            z-index: 10;
            position: relative;
        }

        .title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .header-title {
            font-size: 22px;
            font-weight: bold;
            color: #4A148C;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        /* Estilo para el subtítulo de recomendación AR */
        .header-subtitle {
            font-size: 13px;
            color: #6B3E99;
            text-align: center;
            margin-top: 6px;
            max-width: 90%;
            line-height: 1.3;
        }

        .usagi-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            border-radius: 50%;
            transition: transform 0.1s ease;
            position: relative;
        }

        .usagi-btn:active {
            transform: scale(0.9);
        }

        .usagi-thumb {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #7B2CBF;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
            display: block;
        }

        .sparkle {
            position: absolute;
            font-size: 16px;
            pointer-events: none;
            animation: burstOut 0.8s ease-out forwards;
            z-index: 100;
        }

        @keyframes burstOut {
            0% { opacity: 1; transform: translate(0, 0) scale(0.4); }
            100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.3); }
        }

        .mate-image-header {
            width: 85px;
            height: auto;
            margin: 8px 0 6px 0;
            filter: drop-shadow(0px 3px 5px rgba(0, 0, 0, 0.15));
            z-index: 10;
        }

        model-viewer {
            width: 100%;
            flex: 1;
            background-color: #F3EAFE;
            --poster-color: transparent; 
        }

        .loading-text-container {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .loading-text {
            font-size: 18px;
            color: #5A189A;
            font-weight: 600;
            max-width: 80%;
            background-color: rgba(232, 223, 245, 0.85);
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            line-height: 1.4;
        }

        /* Estilo para el botón AR nativo de model-viewer */
        #ar-button {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #7B2CBF;
            border-radius: 30px;
            border: none;
            color: white;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(123, 44, 191, 0.4);
            cursor: pointer;
            z-index: 10;
            white-space: nowrap;
        }

        #ar-button:active {
            background-color: #5A189A;
            transform: translateX(-50%) scale(0.95);
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="title-row">
            <div class="header-title">Bienvenido a mi página. ٩(ˊᗜˋ )و</div>
            <button class="usagi-btn" id="usagiButton" type="button" aria-label="Conejo interactivo">
                <img src="chiikawa-usagi.jfif" alt="Conejo" class="usagi-thumb">
            </button>
        </div>
        <div class="header-subtitle">Recomendación: enfoca hacia una superficie con textura rugosa el celular y tenelo a una distancia media para que funcione correctamente.</div>
    </div>

    <img src="BRAVO-4001B-VIOLETA-1.jpg" alt="Mate Urbano" class="mate-image-header">

    <!-- model-viewer con soporte AR -->
    <model-viewer 
        id="modelViewer"
        src="mateurbano.glb" 
        ios-src="mate_urbanoaipon.usdz"
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        ar-scale="auto"
        ar-placement="floor"
        camera-controls 
        poster="cargando.png" 
        shadow-intensity="1" 
        auto-rotate>
        
        <div slot="poster" class="loading-text-container">
            <div class="loading-text">
                Este es mi objeto de estudio, el mate "BRAVO" visto en AR. ¡Divertite!
            </div>
        </div>

        <button slot="ar-button" id="ar-button">
            🎇 Ver en tu espacio (AR) 🎇
        </button>
        
    </model-viewer>

    <script>
        const usagiButton = document.getElementById('usagiButton');

        usagiButton.addEventListener('click', () => {
            const rect = usagiButton.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const numSparkles = 8;
            const symbols = ['✨', '⭐', '💫', '✨'];

            for (let i = 0; i < numSparkles; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                
                const angle = Math.random() * Math.PI * 2;
                const radius = 22 + Math.random() * 8; 

                const startX = centerX + Math.cos(angle) * radius;
                const startY = centerY + Math.sin(angle) * radius;

                sparkle.style.left = `${startX}px`;
                sparkle.style.top = `${startY}px`;

                const distanceOut = 30 + Math.random() * 25;
                const dx = Math.cos(angle) * distanceOut;
                const dy = Math.sin(angle) * distanceOut;
                
                sparkle.style.setProperty('--dx', `${dx}px`);
                sparkle.style.setProperty('--dy', `${dy}px`);

                document.body.appendChild(sparkle);

                setTimeout(() => {
                    sparkle.remove();
                }, 800);
            }
        });
    </script>

</body>
</html>
