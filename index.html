<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido a mi página</title>
    
    <!-- Importación oficial de model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        /* Fondo general con el tono lila pastel */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #E8DFF5; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Contenedor del encabezado (Título + Botón del conejo) */
        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            padding: 0 15px;
            z-index: 10;
        }

        /* Título superior de bienvenida */
        .header-title {
            font-size: 22px;
            font-weight: bold;
            color: #4A148C;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        /* Botón del conejo */
        .usagi-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            border-radius: 50%;
            transition: transform 0.1s ease;
        }

        .usagi-btn:active {
            transform: scale(0.9);
        }

        /* Miniatura circular del conejo */
        .usagi-thumb {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #7B2CBF;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
            display: block;
        }

        /* Imagen del mate ubicada justo debajo del título */
        .mate-image-header {
            width: 90px;
            height: auto;
            margin: 12px 0 8px 0;
            filter: drop-shadow(0px 3px 5px rgba(0, 0, 0, 0.15));
            z-index: 10;
        }

        /* Contenedor del visor 3D en lila claro */
        model-viewer {
            width: 100%;
            flex: 1; /* Ocupa el espacio central restante */
            background-color: #F3EAFE;
            --poster-color: transparent; 
        }

        /* Texto descriptivo de fondo que aparece al cargar */
        .loading-text-container {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .loading-text {
            font-size: 18px;
            color: #5A189A;
            font-weight: 600;
            max-width: 80%;
            background-color: rgba(232, 223, 245, 0.85);
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            line-height: 1.4;
        }

        /* Contenedor flotante inferior para el botón AR */
        .ar-controls-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        /* Botón inferior para activar la Realidad Aumentada */
        #ar-button {
            background-color: #7B2CBF;
            border-radius: 30px;
            border: none;
            color: white;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(123, 44, 191, 0.4);
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
            white-space: nowrap;
        }

        #ar-button:active {
            background-color: #5A189A;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Encabezado con título y botón del conejo -->
    <div class="header-container">
        <div class="header-title">Bienvenido a mi página. ٩(ˊᗜˋ )u </div>
        <button class="usagi-btn" type="button" aria-label="Conejo interactivo">
            <img src="chiikawa-usagi.jfif" alt="Conejo" class="usagi-thumb">
        </button>
    </div>

    <!-- Imagen del mate colocada debajo del título -->
    <img src="BRAVO-4001B-VIOLETA-1.jpg" alt="Mate Urbano" class="mate-image-header">

    <!-- Visor 3D -->
    <model-viewer 
        src="mateurbano.glb" 
        ios-src="mate_urbanoaipon.usdz"
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        poster="cargando.png" 
        shadow-intensity="1" 
        auto-rotate>
        
        <!-- Texto explicativo de fondo -->
        <div slot="poster" class="loading-text-container">
            <div class="loading-text">
                Este es mi objeto de estudio, el mate "BRAVO" visto en AR. ¡Divertite!
            </div>
        </div>

        <!-- Botón flotante inferior de Realidad Aumentada -->
        <div class="ar-controls-container">
            <button slot="ar-button" id="ar-button">
                🎇 Ver en tu espacio (AR) 🎇
            </button>
        </div>
        
    </model-viewer>

</body>
</html>
        
    </model-viewer>

</body>
</html>
